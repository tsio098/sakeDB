<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1E3E6"/>
      <stop offset="45%" stop-color="#B4D9D5"/>
      <stop offset="100%" stop-color="#68A69B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7DA78"/>
      <stop offset="100%" stop-color="#F2CD5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)" opacity="0.7"/>

  <!-- ガラス円 -->
  <circle cx="256" cy="256" r="170" fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.75)" stroke-width="2"/>
  <circle cx="256" cy="256" r="170" fill="url(#glow)" opacity="0.6"/>

  <!-- 酒の徳利シルエット -->
  <g transform="translate(256 268)" fill="none" stroke="#1b2c2a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- 徳利の本体 -->
    <path d="M -56 -56
             L -56 -96
             Q -56 -108 -44 -108
             L 44 -108
             Q 56 -108 56 -96
             L 56 -56
             Q 92 -28 92 32
             Q 92 90 32 96
             L -32 96
             Q -92 90 -92 32
             Q -92 -28 -56 -56 Z" fill="rgba(255,255,255,0.85)"/>
    <!-- 注ぎ口 -->
    <line x1="-28" y1="-108" x2="28" y2="-108"/>
  </g>

  <!-- ゴールドアクセント（雫） -->
  <circle cx="332" cy="180" r="14" fill="url(#gold)" opacity="0.9"/>
</svg>
