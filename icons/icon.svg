<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8CB47"/>
      <stop offset="30%" stop-color="#84B566"/>
      <stop offset="65%" stop-color="#45A29A"/>
      <stop offset="100%" stop-color="#357AA3"/>
    </linearGradient>
    <filter id="softshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feOffset dx="0" dy="6" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>

  <!-- フルブリードのグラデーション背景 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 徳利シルエット -->
  <g fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- 本体の輪郭（rim + neck + body + bottom を1ストロークで） -->
    <path d="
      M 386 218
      L 638 218
      L 638 302
      Q 638 332 660 358
      Q 762 432 766 600
      Q 770 808 512 822
      Q 254 808 258 600
      Q 262 432 364 358
      Q 386 332 386 302
      Z
    "/>
    <!-- 横方向の仕切り線 -->
    <line x1="318" y1="608" x2="706" y2="608"/>
  </g>
</svg>
