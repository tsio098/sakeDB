# Cloudflare Workers — 日本酒DB 設定
# 静的アセット配信 ＋ /api を GAS にプロキシするWorker構成

name = "sake-db"
main = "_worker.js"
compatibility_date = "2025-01-01"

# 静的アセットを env.ASSETS にバインド
# run_worker_first = true でWorkerを必ず先に実行（/api ルートをWorkerが処理できるように）
[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
